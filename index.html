<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quest - Millionaire Edition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0,255,255,0.2);
        }

        .game-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00f5ff, #a855f7, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes shimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .stats-container {
            display: flex;
            justify-content: center;
            max-width: 800px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 15px 25px;
            border-radius: 15px;
            border: 1px solid rgba(0,255,255,0.3);
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0,255,255,0.3);
        }

        .stat-label { font-size: 0.9em; color: #00f5ff; margin-bottom: 5px; }
        .stat-value { font-size: 1.5em; font-weight: bold; }

        .main-container {
            display: flex;
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
            gap: 30px;
        }

        .level-ladder {
            width: 280px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 20px;
            border: 2px solid rgba(0,255,255,0.2);
            height: fit-content;
            position: sticky;
            top: 20px;
        }

        .ladder-title {
            text-align: center;
            font-size: 1.3em;
            color: #00f5ff;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .ladder-item {
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .ladder-item.current {
            background: linear-gradient(90deg, rgba(168,85,247,0.3), rgba(0,245,255,0.3));
            border-color: #00f5ff;
            transform: scale(1.05);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%,100% { box-shadow: 0 0 20px rgba(0,245,255,0.5); }
            50%      { box-shadow: 0 0 30px rgba(0,245,255,0.8); }
        }

        .ladder-item.completed { background: rgba(34,197,94,0.2); border-color: #22c55e; }
        .ladder-item.milestone { background: rgba(255,193,7,0.2); border-color: #ffc107; }
        .ladder-item.milestone.completed { background: rgba(255,193,7,0.3); border-color: #ffc107; }

        .ladder-level  { font-weight: bold; color: #00f5ff; }
        .ladder-reward { color: #ffd700; font-size: 0.9em; }
        .ladder-icon   { font-size: 1.2em; margin-left: 10px; }

        .game-container { flex: 1; max-width: 900px; }

        .question-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            border: 2px solid rgba(0,255,255,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
        }

        .question-number { color: #a855f7; font-size: 0.9em; margin-bottom: 10px; }
        .question-text   { font-size: 1.8em; margin-bottom: 15px; color: #00f5ff; font-weight: 600; }
        .question-example{ font-size: 1em; color: #ccc; font-style: italic; margin-bottom: 20px; }

        .timer-bar { height: 8px; background: rgba(255,255,255,0.1); border-radius: 10px; overflow: hidden; margin-top: 20px; }
        .timer-fill { height: 100%; background: linear-gradient(90deg, #ff006e, #ffbe0b); transition: width 0.1s linear; }

        .answers-grid { display: flex; flex-direction: column; gap: 15px; margin-top: 30px; }

        .answer-btn {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0,255,255,0.3);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            text-align: left;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            background: rgba(0,255,255,0.3);
            transform: translate(-50%,-50%);
            transition: width 0.6s, height 0.6s;
        }

        .answer-btn:hover {
            background: rgba(0,255,255,0.15);
            border-color: #00f5ff;
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0,255,255,0.3);
        }

        .answer-btn:hover::before { width: 300px; height: 300px; }
        .answer-btn:active { transform: translateY(-1px); }

        .answer-btn.correct {
            background: rgba(34,197,94,0.3);
            border-color: #22c55e;
            animation: correct-flash 0.5s ease;
        }

        .answer-btn.wrong {
            background: rgba(239,68,68,0.3);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        @keyframes correct-flash {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.7; transform: scale(1.05); }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-10px); }
            75%     { transform: translateX(10px); }
        }

        .feedback-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .feedback-card {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(20px);
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            text-align: center;
            border: 2px solid rgba(0,255,255,0.3);
        }

        .feedback-icon  { font-size: 4em; margin-bottom: 20px; }
        .feedback-title { font-size: 2em; margin-bottom: 15px; color: #00f5ff; }
        .feedback-text  { font-size: 1.1em; margin-bottom: 20px; line-height: 1.6; white-space: pre-line; }

        .continue-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none; color: #fff;
            padding: 15px 40px;
            border-radius: 10px; font-size: 1.1em;
            cursor: pointer; transition: all 0.3s ease;
        }

        .continue-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(0,255,255,0.5); }

        .start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .start-content { text-align: center; padding: 40px; }

        .start-title {
            font-size: 4em; margin-bottom: 20px;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .start-subtitle { font-size: 1.5em; color: #ccc; margin-bottom: 40px; }

        .start-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none; color: #fff;
            padding: 20px 60px;
            border-radius: 15px; font-size: 1.5em;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,255,255,0.3);
        }

        .start-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0,255,255,0.5); }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }

        .particle {
            position: absolute; width: 4px; height: 4px;
            background: #00f5ff; border-radius: 50%; opacity: 0.5;
            animation: float 6s infinite;
        }

        @keyframes float {
            0%,100% { transform: translateY(0) translateX(0); }
            50%     { transform: translateY(-30px) translateX(20px); }
        }

        @media (max-width: 1024px) {
            .main-container { flex-direction: column-reverse; }
            .level-ladder { width: 100%; position: relative; top: 0; }
        }

        @media (max-width: 768px) {
            .game-title { font-size: 1.8em; }
            .question-text { font-size: 1.3em; }
            .start-title { font-size: 2.5em; }
        }
    </style>
</head>
<body>

<div class="particles" id="particles"></div>

<div class="start-screen" id="startScreen">
    <div class="start-content">
        <h1 class="start-title">🎮 TEST</h1>
        <p class="start-subtitle">Kiểm tra từ vựng</p>
        <button class="start-btn" onclick="startGame()">BẮT ĐẦU</button>
    </div>
</div>

<header class="header">
    <h1 class="game-title">💰 TEST</h1>

        </div>

            <div class="stat-label">Lần chơi tốt nhất</div>
            <div class="stat-value" id="bestScore">0</div>
        </div>
    </div>
</header>

<div class="main-container">
    <aside class="level-ladder">
        <div class="ladder-title">🏆 THANG ĐIỂM</div>
        <div id="ladderItems"></div>
    </aside>

    <main class="game-container">
        <div class="question-card" id="questionCard">
            <div class="question-number" id="questionNumber">Câu hỏi 1</div>
            <div class="question-text" id="questionText">Loading...</div>
            <div class="question-example" id="questionExample"></div>
            <div class="timer-bar">
                <div class="timer-fill" id="timerFill" style="width:100%"></div>
            </div>
            <div class="answers-grid" id="answersGrid"></div>
        </div>
    </main>
</div>

<div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-card">
        <div class="feedback-icon" id="feedbackIcon">✅</div>
        <div class="feedback-title" id="feedbackTitle">Chính xác!</div>
        <div class="feedback-text" id="feedbackText"></div>
        <button class="continue-btn" onclick="handleFeedbackAction()">Tiếp tục</button>
    </div>
</div>

// ==================== GAME CONFIG ====================
const levelRewards = Array.from({ length: 20 }, (_, i) => {
    const level = i + 1;
    const reward = (100 * level).toLocaleString();
    const milestone = [5, 10, 15, 20].includes(level);
    return { level, reward, milestone };
});

// ==================== GAME STATE ====================
let gameState = {
    currentLevel: 1,
    totalScore: 0,
    bestScore: 0,
    currentQuestion: null,
    usedQuestions: [],
    timer: null,
    timeLeft: 30,
    isWrong: false
};

let questionPlan = [];

// ==================== STORAGE ====================
function loadGameState() {
    try {
        const saved = localStorage.getItem('englishMillionaireSave');
        if (saved) {
            const data = JSON.parse(saved);
            gameState.bestScore = data.bestScore || 0;
        }
    } catch(e) { gameState.bestScore = 0; }
}

function saveGameState() {
    try {
        localStorage.setItem('englishMillionaireSave', JSON.stringify({ bestScore: gameState.bestScore }));
    } catch(e) {}
}

// ==================== INIT ====================
function init() {
    createParticles();
    loadGameState();
    createLadder();
    updateUI();
}

function createParticles() {
    const container = document.getElementById('particles');
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = Math.random() * 100 + '%';
        p.style.top  = Math.random() * 100 + '%';
        p.style.animationDelay    = Math.random() * 6 + 's';
        p.style.animationDuration = (Math.random() * 4 + 4) + 's';
        container.appendChild(p);
    }
}

function createLadder() {
    const container = document.getElementById('ladderItems');
    container.innerHTML = '';
    for (let i = levelRewards.length - 1; i >= 0; i--) {
        const item = levelRewards[i];
        const div  = document.createElement('div');
        div.className = 'ladder-item' + (item.milestone ? ' milestone' : '');
        div.id = `ladder-${item.level}`;
        div.innerHTML = `
            <span class="ladder-level">Câu ${item.level}</span>
            <span class="ladder-reward">${item.reward} điểm</span>
            <span class="ladder-icon"></span>
        `;
        container.appendChild(div);
    }
}

function updateLadder() {
    levelRewards.forEach(item => {
        const el = document.getElementById(`ladder-${item.level}`);
        if (!el) return;
        el.classList.remove('current', 'completed');
        const icon = el.querySelector('.ladder-icon');
        if (item.level < gameState.currentLevel) {
            el.classList.add('completed');
            icon.textContent = '✓';
        } else if (item.level === gameState.currentLevel) {
            el.classList.add('current');
            icon.textContent = '👉';
        } else {
            icon.textContent = '';
        }
    });
}

// ==================== HELPERS ====================
function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function buildQuestionPlan() {
    const plan = [];
    const usedWords = new Set();

    for (let lvl = 1; lvl <= 20; lvl++) {
        let pool = vocabulary.filter(v => v.level === lvl && !usedWords.has(v.word));
        if (!pool.length) pool = vocabulary.filter(v => v.level <= lvl && !usedWords.has(v.word));
        if (!pool.length) pool = vocabulary;

        const picked = pool[Math.floor(Math.random() * pool.length)];
        usedWords.add(picked.word);
        plan.push(picked);
    }
    return plan;
}

// ==================== GAME FLOW ====================
function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    resetGame();
    loadQuestion();
}

function resetGame() {
    gameState.currentLevel  = 1;
    gameState.totalScore    = 0;
    gameState.usedQuestions = [];
    gameState.isWrong       = false;
    questionPlan = buildQuestionPlan();
    updateUI();
    updateLadder();
}

function loadQuestion() {
    const question = questionPlan[gameState.currentLevel - 1];
    gameState.currentQuestion = question;

    const wrongPool = vocabulary.filter(v =>
        v.word !== question.word &&
        Math.abs((v.level || 1) - (question.level || 1)) <= 2
    );
    const candidates = wrongPool.length ? wrongPool : vocabulary.filter(v => v.word !== question.word);
    const wrongAnswers = shuffleArray(candidates).slice(0, 3).map(v => v.meaning);

    // Make sure no duplicate meanings
    const uniqueWrong = [...new Set(wrongAnswers)].filter(m => m !== question.meaning).slice(0, 3);
    while (uniqueWrong.length < 3) {
        const fallback = vocabulary.filter(v => v.word !== question.word && !uniqueWrong.includes(v.meaning) && v.meaning !== question.meaning);
        if (!fallback.length) break;
        uniqueWrong.push(fallback[Math.floor(Math.random() * fallback.length)].meaning);
    }

    const answers = shuffleArray([...uniqueWrong, question.meaning]);

    document.getElementById('questionNumber').textContent  = `Câu hỏi ${gameState.currentLevel} / 20`;
    document.getElementById('questionText').textContent    = question.word;
    document.getElementById('questionExample').textContent = question.example ? `"${question.example}"` : '';

    const grid = document.getElementById('answersGrid');
    grid.innerHTML = '';
    answers.forEach(answer => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = answer;
        btn.onclick = () => checkAnswer(answer);
        grid.appendChild(btn);
    });

    startTimer();
}

function startTimer() {
    gameState.timeLeft = 30;
    const fill = document.getElementById('timerFill');
    clearInterval(gameState.timer);
    gameState.timer = setInterval(() => {
        gameState.timeLeft -= 0.1;
        fill.style.width = Math.max(0, (gameState.timeLeft / 30) * 100) + '%';
        if (gameState.timeLeft <= 0) {
            clearInterval(gameState.timer);
            checkAnswer(null);
        }
    }, 100);
}

function checkAnswer(answer) {
    clearInterval(gameState.timer);
    const buttons = document.querySelectorAll('.answer-btn');
    buttons.forEach(btn => { btn.onclick = null; });

    const correct = answer === gameState.currentQuestion.meaning;

    if (correct) {
        buttons.forEach(btn => {
            if (btn.textContent === answer) btn.classList.add('correct');
        });

        const reward = parseInt(levelRewards[gameState.currentLevel - 1].reward.replace(/,/g, ''));
        gameState.totalScore += reward;

        if (gameState.currentLevel === 20) {
            gameState.isWrong = false;
            setTimeout(() => showFeedback('🎉', 'CHIẾN THẮNG!',
                `Chúc mừng! Bạn đã chinh phục 20 câu hỏi!\nTổng điểm: ${gameState.totalScore.toLocaleString()} điểm`), 800);
        } else {
            setTimeout(() => showFeedback('✅', 'Chính xác!',
                `+${reward.toLocaleString()} điểm\n"${gameState.currentQuestion.word}" nghĩa là "${gameState.currentQuestion.meaning}"`), 500);
        }

    } else {
        buttons.forEach(btn => {
            if (btn.textContent === gameState.currentQuestion.meaning) {
                btn.classList.add('correct');
            } else if (answer === null || btn.textContent === answer) {
                btn.classList.add('wrong');
            }
        });

        gameState.isWrong = true;

        let finalScore = 0;
        for (let i = gameState.currentLevel - 1; i >= 0; i--) {
            if (levelRewards[i].milestone) {
                finalScore = parseInt(levelRewards[i].reward.replace(/,/g, ''));
                break;
            }
        }

        gameState.totalScore = finalScore;

        setTimeout(() => showFeedback('❌', 'Trả lời sai!',
            `Đáp án đúng: "${gameState.currentQuestion.meaning}"\n\nBạn về mốc an toàn với ${finalScore.toLocaleString()} điểm\n\n"${gameState.currentQuestion.word}" - ${gameState.currentQuestion.meaning}\nVí dụ: ${gameState.currentQuestion.example}`), 500);
    }

    if (gameState.totalScore > gameState.bestScore) {
        gameState.bestScore = gameState.totalScore;
        saveGameState();
    }

    updateUI();
}

function showFeedback(icon, title, text) {
    document.getElementById('feedbackIcon').textContent  = icon;
    document.getElementById('feedbackTitle').textContent = title;
    document.getElementById('feedbackText').textContent  = text;
    document.getElementById('feedbackOverlay').style.display = 'flex';
}

function handleFeedbackAction() {
    document.getElementById('feedbackOverlay').style.display = 'none';
    if (gameState.isWrong || gameState.currentLevel === 20) {
        document.getElementById('startScreen').style.display = 'flex';
        resetGame();
    } else {
        gameState.currentLevel++;
        updateLadder();
        loadQuestion();
    }
}

function updateUI() {
    document.getElementById('currentLevel').textContent = gameState.currentLevel;
    document.getElementById('totalScore').textContent   = gameState.totalScore.toLocaleString();
    document.getElementById('bestScore').textContent    = gameState.bestScore.toLocaleString();
}

init();
</script>
