<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Quest</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .header {
            padding: 20px;
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid rgba(0,255,255,0.2);
        }

        .game-title {
            text-align: center;
            font-size: 2.5em;
            font-weight: bold;
            background: linear-gradient(90deg, #00f5ff, #a855f7, #00f5ff);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes shimmer {
            0%   { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .stats-container {
            display: flex;
            justify-content: center;
            max-width: 900px;
            margin: 0 auto;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-item {
            background: rgba(255,255,255,0.1);
            padding: 12px 25px;
            border-radius: 15px;
            border: 1px solid rgba(0,255,255,0.3);
            transition: all 0.3s ease;
            text-align: center;
        }

        .stat-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0,255,255,0.3);
        }

        .stat-label { font-size: 0.85em; color: #00f5ff; margin-bottom: 4px; }
        .stat-value { font-size: 1.5em; font-weight: bold; }

        .streak-bar-wrap {
            max-width: 700px;
            margin: 14px auto 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .streak-label { font-size: 0.85em; color: #ffd700; white-space: nowrap; }

        .streak-track {
            flex: 1;
            height: 10px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        .streak-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff9900, #ffd700);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .main-container {
            max-width: 780px;
            margin: 35px auto;
            padding: 0 20px;
        }

        .question-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 35px 40px;
            margin-bottom: 25px;
            border: 2px solid rgba(0,255,255,0.2);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .question-number { color: #a855f7; font-size: 0.9em; margin-bottom: 10px; }

        .question-text {
            font-size: 2em;
            color: #00f5ff;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .question-example {
            font-size: 0.95em;
            color: #bbb;
            font-style: italic;
            min-height: 22px;
        }

        .timer-bar {
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 18px;
        }

        .timer-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff006e, #ffbe0b);
            transition: width 0.1s linear;
        }

        /* 6 answers — 2 columns × 3 rows */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 28px;
        }

        .answer-btn {
            background: rgba(255,255,255,0.08);
            border: 2px solid rgba(0,255,255,0.3);
            color: #fff;
            padding: 18px 16px;
            border-radius: 14px;
            font-size: 1.05em;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
            text-align: left;
            line-height: 1.3;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 0; height: 0;
            border-radius: 50%;
            background: rgba(0,255,255,0.2);
            transform: translate(-50%,-50%);
            transition: width 0.5s, height 0.5s;
        }

        .answer-btn:hover {
            background: rgba(0,255,255,0.15);
            border-color: #00f5ff;
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0,255,255,0.25);
        }

        .answer-btn:hover::before { width: 280px; height: 280px; }

        .answer-btn.correct {
            background: rgba(34,197,94,0.35);
            border-color: #22c55e;
            animation: correct-flash 0.5s ease;
        }

        .answer-btn.wrong {
            background: rgba(239,68,68,0.35);
            border-color: #ef4444;
            animation: shake 0.5s ease;
        }

        @keyframes correct-flash {
            0%,100% { opacity: 1; }
            50%      { opacity: 0.7; transform: scale(1.04); }
        }

        @keyframes shake {
            0%,100% { transform: translateX(0); }
            25%     { transform: translateX(-8px); }
            75%     { transform: translateX(8px); }
        }

        .feedback-overlay {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .feedback-card {
            background: rgba(15,15,40,0.97);
            backdrop-filter: blur(20px);
            padding: 40px 45px;
            border-radius: 22px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            border: 2px solid rgba(0,255,255,0.35);
            box-shadow: 0 0 60px rgba(0,255,255,0.12);
        }

        .feedback-icon  { font-size: 4em; margin-bottom: 15px; }
        .feedback-title { font-size: 2em; margin-bottom: 12px; color: #00f5ff; }
        .feedback-text  { font-size: 1.05em; margin-bottom: 25px; line-height: 1.7; white-space: pre-line; color: #ddd; }

        .continue-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none; color: #fff;
            padding: 14px 40px;
            border-radius: 12px; font-size: 1.1em;
            cursor: pointer; transition: all 0.3s ease;
            font-weight: 700;
        }

        .continue-btn:hover { transform: scale(1.05); box-shadow: 0 10px 30px rgba(0,255,255,0.4); }

        .start-screen {
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0a0e27 0%, #1a1a2e 50%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1001;
        }

        .start-content { text-align: center; padding: 40px; }

        .start-title {
            font-size: 3.5em; margin-bottom: 15px;
            background: linear-gradient(90deg, #00f5ff, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .start-subtitle { font-size: 1.3em; color: #aaa; margin-bottom: 35px; }

        .start-info {
            display: flex;
            gap: 18px;
            justify-content: center;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .start-info-item {
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(0,255,255,0.3);
            border-radius: 12px;
            padding: 12px 20px;
            font-size: 0.95em;
            color: #ccc;
        }

        .start-info-item span { color: #00f5ff; font-weight: bold; }

        .start-btn {
            background: linear-gradient(90deg, #a855f7, #00f5ff);
            border: none; color: #fff;
            padding: 18px 60px;
            border-radius: 15px; font-size: 1.4em;
            cursor: pointer; transition: all 0.3s ease;
            box-shadow: 0 10px 40px rgba(0,255,255,0.3);
            font-weight: 700;
        }

        .start-btn:hover { transform: translateY(-5px); box-shadow: 0 15px 50px rgba(0,255,255,0.5); }

        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }

        .particle {
            position: absolute; width: 3px; height: 3px;
            background: #00f5ff; border-radius: 50%; opacity: 0.35;
            animation: float 6s infinite;
        }

        @keyframes float {
            0%,100% { transform: translateY(0) translateX(0); }
            50%      { transform: translateY(-25px) translateX(15px); }
        }

        @media (max-width: 600px) {
            .answers-grid { grid-template-columns: 1fr; }
            .question-text { font-size: 1.5em; }
            .start-title { font-size: 2.5em; }
            .question-card { padding: 25px 20px; }
        }
    </style>
</head>

<div class="particles" id="particles"></div>

        <div class="question-example" id="questionExample"></div>
        <div class="timer-bar">
            <div class="timer-fill" id="timerFill" style="width:100%"></div>
        </div>
        <div class="answers-grid" id="answersGrid"></div>
    </div>
</div>

<!-- Feedback Overlay -->
<div class="feedback-overlay" id="feedbackOverlay">
    <div class="feedback-card">
        <div class="feedback-icon" id="feedbackIcon">✅</div>
        <div class="feedback-title" id="feedbackTitle">Chính xác!</div>
        <div class="feedback-text" id="feedbackText"></div>
        <button class="continue-btn" onclick="nextQuestion()">Tiếp tục →</button>
    </div>
</div>

// ==================== GAME STATE ====================
let gs = {
    qNum:       1,
    score:      0,
    best:       0,
    streak:     0,
    question:   null,
    pool:       [],
    poolIdx:    0,
    timer:      null,
    timeLeft:   30
};

// ==================== STORAGE ====================
function loadState() {
    try { const d = JSON.parse(localStorage.getItem('eq3')||'{}'); gs.best = d.best || 0; } catch(e) {}
}
function saveState() {
    try { localStorage.setItem('eq3', JSON.stringify({ best: gs.best })); } catch(e) {}
}

// ==================== HELPERS ====================
function shuffle(a) {
    const b = [...a];
    for (let i = b.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [b[i], b[j]] = [b[j], b[i]];
    }
    return b;
}

function nextWord() {
    if (gs.poolIdx >= gs.pool.length) { gs.pool = shuffle(vocabulary); gs.poolIdx = 0; }
    return gs.pool[gs.poolIdx++];
}

// ==================== INIT ====================
function init() {
    createParticles();
    loadState();
    updateUI();
}

function createParticles() {
    const c = document.getElementById('particles');
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        p.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;animation-delay:${Math.random()*6}s;animation-duration:${Math.random()*4+4}s`;
        c.appendChild(p);
    }
}

// ==================== GAME ====================
function startGame() {
    document.getElementById('startScreen').style.display = 'none';
    gs.qNum   = 1;
    gs.score  = 0;
    gs.streak = 0;
    gs.pool   = shuffle(vocabulary);
    gs.poolIdx = 0;
    updateUI();
    loadQuestion();
}

function loadQuestion() {
    const q = nextWord();
    gs.question = q;

    // Build 5 unique wrong answers
    const others = vocabulary.filter(v => v.word !== q.word && v.meaning !== q.meaning);
    const close  = others.filter(v => Math.abs((v.level||1) - (q.level||1)) <= 2);
    const src    = close.length >= 5 ? close : others;
    const wrongSet = new Set();
    for (const v of shuffle(src)) {
        wrongSet.add(v.meaning);
        if (wrongSet.size === 5) break;
    }
    // fill if needed
    if (wrongSet.size < 5) {
        for (const v of shuffle(vocabulary)) {
            if (v.meaning !== q.meaning && !wrongSet.has(v.meaning)) wrongSet.add(v.meaning);
            if (wrongSet.size === 5) break;
        }
    }

    const answers = shuffle([...wrongSet, q.meaning]);

    document.getElementById('questionNumber').textContent  = `Câu ${gs.qNum}`;
    document.getElementById('questionText').textContent    = q.word;
    document.getElementById('questionExample').textContent = q.example ? `"${q.example}"` : '';

    const grid = document.getElementById('answersGrid');
    grid.innerHTML = '';
    answers.forEach(ans => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = ans;
        btn.onclick = () => checkAnswer(ans);
        grid.appendChild(btn);
    });

    startTimer();
}

function startTimer() {
    gs.timeLeft = 30;
    const fill = document.getElementById('timerFill');
    clearInterval(gs.timer);
    gs.timer = setInterval(() => {
        gs.timeLeft -= 0.1;
        fill.style.width = Math.max(0, (gs.timeLeft / 30) * 100) + '%';
        if (gs.timeLeft <= 0) { clearInterval(gs.timer); checkAnswer(null); }
    }, 100);
}

function checkAnswer(answer) {
    clearInterval(gs.timer);
    document.querySelectorAll('.answer-btn').forEach(b => { b.onclick = null; });

    const q = gs.question;
    const ok = answer === q.meaning;

    document.querySelectorAll('.answer-btn').forEach(b => {
        if (b.textContent === q.meaning) b.classList.add('correct');
        else if (!answer || b.textContent === answer) b.classList.add('wrong');
    });

    if (ok) {
        gs.streak++;
        const bonus  = Math.floor(gs.streak / 5) * 50;
        const pts    = 100 + bonus;
        gs.score    += pts;
        if (gs.score > gs.best) { gs.best = gs.score; saveState(); }
        updateUI();
        const bonusMsg = bonus > 0 ? `\n🔥 Chuỗi ${gs.streak}! +${bonus} thưởng!` : '';
        setTimeout(() => showFeedback('✅', 'Chính xác!',
            `+${pts} điểm${bonusMsg}\n\n"${q.word}" = "${q.meaning}"`), 400);
    } else {
        gs.streak = 0;
        updateUI();
        const timeMsg = !answer ? '\n⏰ Hết thời gian!' : '';
        setTimeout(() => showFeedback('❌', 'Sai rồi!',
            `${timeMsg}Đáp án đúng: "${q.meaning}"\n\nVí dụ: ${q.example}`), 400);
    }
}

function showFeedback(icon, title, text) {
    document.getElementById('feedbackIcon').textContent  = icon;
    document.getElementById('feedbackTitle').textContent = title;
    document.getElementById('feedbackText').textContent  = text;
    document.getElementById('feedbackOverlay').style.display = 'flex';
}

function nextQuestion() {
    document.getElementById('feedbackOverlay').style.display = 'none';
    gs.qNum++;
    loadQuestion();
    updateUI();
}

function updateUI() {
    document.getElementById('statQuestion').textContent = gs.qNum;
    document.getElementById('statScore').textContent    = gs.score.toLocaleString();
    document.getElementById('statStreak').textContent   = `${gs.streak} 🔥`;
    document.getElementById('statBest').textContent     = gs.best.toLocaleString();

    const pct = Math.min((gs.streak % 5) / 5 * 100, 100);
    document.getElementById('streakFill').style.width  = pct + '%';
    document.getElementById('streakCount').textContent = `${gs.streak % 5} / 5`;
}

init();
</script>
